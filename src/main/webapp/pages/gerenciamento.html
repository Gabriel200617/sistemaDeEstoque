<!DOCTYPE html>
<html lang="en">

    <head>
        <link rel="stylesheet" href="../css/reset.css" />
        <link rel="stylesheet" href="../css/cores.css" />
        <link rel="stylesheet" href="../css/gerenciamento.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tela | Gerenciamento</title>
    </head>

    <body>
        <header id="header">
            <h1 id="tituloCadastro">Sistema de estoque</h1>
            <nav id="menu">
                <ul class="menu-lista">
                    <li><a href="dashboard.html">Início</a></li>
                    <li><a href="#">Gerenciamento</a></li>
                    <li><a href="cadastro.html" class="btn-menu">Cadastro</a></li>
                    <li><a href="#" id="btnLogout" class="btn-menu">Sair</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="container">
                <div class="box">
                    <div class="box-itens">
                        <h3 class="itens-title">Total de Itens:</h3>
                        <p class="itens" id="itens-quantidade">0</p>
                    </div>
                </div>
                <div class="box">
                    <div class="box-itens">
                        <h3 class="itens-title">Estoque Baixo:</h3>
                        <p class="itens" id="itens-estoque">0</p>
                    </div>
                </div>
                <div class="box">
                    <div class="box-itens">
                        <h3 class="itens-title">Valor Total:</h3>
                        <p class="itens" id="itens-total">
                            <strong id="valor-dinamico">0,00</strong> 
                        </p>
                    </div>
                </div>
            </section>
            <section class="container-grafico">
                <div class="dashboard-card">
                    <h3 class="grafico-title">Nível de Estoque por Categoria</h3>
                    <div id="meu-grafico" class="chart-container"></div>
                </div>
            </section>
            
            <section class="container-pesquisar">
                <div class="caixa-pesquisa">
                    <label for="nomeProduto">Pesquise o produto</label>
                    <input type="text" name="nomeProduto" id="nomeDigitado" class="input-pesquisa">
                    <button id="btn-pesquisar">Pesquisa</button>    
                </div>
                <div class="produto" id="produto">
                    
                </div>
                <form action="../UpdateProdutos" class="modal-form" method="POST" id="formCadastro">
                    <div class="form">
                    <div class="grupo-form">
                        <label for="codigoBarras">Código de Barras</label>
                        <input type="text" name="codigoBarras" required />
                    </div>

                    <div class="grupo-form">
                        <label for="nomeProduto" >Nome do Produto</label>
                        <input type="text" name="nomeProduto" id="nomeProduto" />
                    </div>

                    <div class="grupo-form">
                        <label for="fabricante" >Fabricante</label>
                        <input type="text" name="fabricante" id="fabricante" />
                    </div>

                    <div class="grupo-form">
                        <label for="marca" >Marca</label>
                        <input type="text" name="marca" id="marca" />
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="dataFabricacao" >Data de Fabricação</label>
                            <input type="date" name="dataFabricacao" id="dataFabricacao"  />
                        </div>

                        <div class="grupo-form">
                            <label for="dataVencimento" >Data de Vencimento</label>
                            <input type="date" name="dataVencimento" id="dataVencimento"  />
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label for="quantidade" >Quantidade</label>
                            <input type="number" name="quantidade" id="quantidade" />
                        </div>

                        <div class="grupo-form">
                            <label for="valor" >Valor Unitário</label>
                            <input type="number" name="valor" id="valor" />
                        </div>
                    </div>
                    <div class="linha-form">
                        <div class="grupo-form full">
                            <label for="total">Total</label>
                            <input type="number" name="total" id="total" />
                        </div>
                    </div>
                    <div class="acoes-form">
                        <button type="submit" class="btn-salvar">Salvar</button>
                        <a href="#" class="btn-cancelar">Cancelar</a>
                    </div>
                        </div>
                </form>
            </section>
        </main>
        <script src="../js/gerenciamento.js"></script>
        <script src="../js/pesquisar.js"></script>
        <script src="../js/logout.js"></script>
    </body>

</html>
